<header class="site-header">
  <div class="site-header__inner">
    <a class="brand-logo" routerLink="/" aria-label="Resume Builder home">
      <img
        class="brand-logo__image"
        src="/images/Logo.webp"
        alt=""
        width="752"
        height="564"
      />
    </a>

    <nav class="account-navigation" aria-label="Account navigation">
      @if (isLoggedIn()) {
        <app-dashboard-settings
          [theme]="theme()"
          [themeSaving]="themeSaving()"
          [profileForm]="profileForm"
          [profileSaving]="profileSaving()"
          [profileMessage]="profileMessage()"
          [profileMessageIsError]="profileMessageIsError()"
          (themeToggle)="toggleTheme()"
          (profileSave)="saveProfile()"
          (logoutClick)="logout()"
        />

        <a
          class="profile-button"
          routerLink="/home"
          aria-label="Open your dashboard"
          matTooltip="Dashboard"
          matTooltipPosition="below"
        >
          <app-icon name="person" />
        </a>
      } @else {
        <a class="login-button" routerLink="/login">Log In</a>
      }
    </nav>
  </div>
</header>
