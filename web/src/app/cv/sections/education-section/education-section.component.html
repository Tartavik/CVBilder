@for (group of groups; track $index; let i = $index) {
  <div [formGroup]="group" class="edu-item">
    <div class="field-row">
      <app-form-text-field
        [control]="group.get('institution')"
        label="Institution"
        placeholder="KPI"
      />
      <app-form-text-field
        [control]="group.get('year')"
        label="Year"
        type="number"
        placeholder="2023"
        [min]="1000"
        [max]="9999"
        patternMessage="Use a four-digit year"
      />
    </div>
    <div class="field-row">
      <app-form-text-field
        [control]="group.get('degree')"
        label="Degree"
        placeholder="Bachelor"
      />
      <app-form-text-field
        [control]="group.get('field')"
        label="Field of study"
        placeholder="Computer Science"
      />
    </div>
    <button
      mat-icon-button
      class="danger-icon-button"
      color="warn"
      type="button"
      (click)="remove(i)"
      aria-label="Remove"
    >
      <app-icon name="delete" />
    </button>
  </div>
}

@if (groups.length === 0) {
  <p class="empty">No education added yet.</p>
}

<button mat-stroked-button type="button" (click)="add()">
  <app-icon name="add" /> Add education
</button>
