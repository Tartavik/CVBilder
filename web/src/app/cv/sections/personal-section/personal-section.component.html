<form [formGroup]="form" class="section-form">
  <app-profile-photo-field
    [photo]="photo()"
    [uploading]="photoUploading()"
    (upload)="onPhotoUpload($event)"
    (remove)="removePhoto()"
  />

  <div class="field-row">
    <app-form-text-field
      [control]="form.controls.fullName"
      label="Full name"
      placeholder="John Doe"
    />
    <app-form-text-field
      [control]="form.controls.jobTitle"
      label="Job title"
      placeholder="Frontend Developer"
    />
  </div>
  <app-form-text-field
    class="full-width"
    [control]="form.controls.email"
    label="Email"
    type="email"
    placeholder="john@example.com"
    patternMessage="Enter a valid email"
  />
  <app-phone-field class="full-width" [control]="form.controls.phone" />
  <app-form-text-field
    class="full-width"
    [control]="form.controls.city"
    label="City"
    placeholder="Kyiv, Ukraine"
  />
  <app-form-textarea-field
    class="full-width"
    [control]="form.controls.summary"
    label="Summary"
    placeholder="Brief professional summary..."
    [rows]="4"
  />
</form>
