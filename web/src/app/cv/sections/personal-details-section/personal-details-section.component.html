<form [formGroup]="form" class="section-form">
  <app-form-text-field
    class="full-width"
    [control]="form.controls.email"
    label="Email"
    type="email"
    patternMessage="Enter a valid email"
  />
  <app-phone-field class="full-width" [control]="form.controls.phone" />
  <app-form-text-field
    class="full-width"
    [control]="form.controls.city"
    label="City"
  />
  <app-form-textarea-field
    class="full-width"
    [control]="form.controls.summary"
    label="Summary"
    placeholder="Brief professional summary..."
    [rows]="4"
  />
</form>
