<mat-chip-set class="tags">
  @for (skill of skills(); track skill) {
    <mat-chip draggable="false" (removed)="remove(skill)">
      {{ skill }}
      <button matChipRemove aria-label="Remove skill">
        <mat-icon>cancel</mat-icon>
      </button>
    </mat-chip>
  }
</mat-chip-set>

<div class="add-row">
  <mat-form-field appearance="outline">
    <mat-label>New skill</mat-label>
    <input matInput [formControl]="newSkill" placeholder="e.g. TypeScript" (keydown.enter)="add()" />
  </mat-form-field>
  <button mat-raised-button color="primary" type="button" (click)="add()">
    <mat-icon>add</mat-icon> Add
  </button>
</div>
