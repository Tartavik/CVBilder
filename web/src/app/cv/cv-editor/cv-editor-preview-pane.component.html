<aside class="cv-preview-pane">
  <div class="preview-actions">
    <app-segmented-control
      [options]="templateOptions"
      [selected]="cv().template"
      (selectedChange)="selectTemplate($event)"
    />

    <div class="action-buttons">
      <a mat-stroked-button routerLink="/home">
        <app-icon-label icon="home">Home</app-icon-label>
      </a>
      <a mat-stroked-button [routerLink]="['/public/cv', cvId()]">
        <app-icon-label icon="visibility">Public page</app-icon-label>
      </a>
      <button
        mat-raised-button
        color="primary"
        type="button"
        [disabled]="saving()"
        (click)="save.emit()"
      >
        @if (saving()) {
          <app-icon-label icon="hourglass_empty">Save</app-icon-label>
        } @else {
          <app-icon-label icon="save">Save</app-icon-label>
        }
      </button>
      @if (saveSuccess()) {
        <span class="save-success">✓ Saved</span>
      }
      @if (error()) {
        <span class="save-error">{{ error() }}</span>
      }
      <button
        mat-raised-button
        color="primary"
        type="button"
        (click)="exportPdf.emit()"
      >
        <app-icon-label icon="picture_as_pdf">Export PDF</app-icon-label>
      </button>
      <button
        mat-raised-button
        color="warn"
        type="button"
        (click)="logout.emit()"
      >
        <app-icon-label icon="logout">Logout</app-icon-label>
      </button>
    </div>
  </div>

  <div class="preview-scroll">
    @if (cv().template === 'classic') {
      <app-cv-preview-classic />
    } @else {
      <app-cv-preview />
    }
  </div>
</aside>
