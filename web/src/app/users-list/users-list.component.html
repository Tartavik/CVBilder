<div class="page">
  <div class="container">
    <div class="header">
      <h1>Users</h1>
      <a mat-raised-button color="primary" routerLink="/register">
        <app-icon name="person_add" />
        New user
      </a>
    </div>

    @if (loading()) {
      <div class="spinner-wrapper">
        <mat-spinner />
      </div>
    } @else if (error()) {
      <p class="request-error">{{ error() }}</p>
    } @else {
      <table mat-table [dataSource]="users()" class="mat-elevation-z2 full-width">
        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>Email</th>
          <td mat-cell *matCellDef="let user">{{ user.email }}</td>
        </ng-container>

        <ng-container matColumnDef="role">
          <th mat-header-cell *matHeaderCellDef>Role</th>
          <td mat-cell *matCellDef="let user">
            <mat-chip-set>
              <mat-chip>{{ user.role }}</mat-chip>
            </mat-chip-set>
          </td>
        </ng-container>

        <ng-container matColumnDef="created">
          <th mat-header-cell *matHeaderCellDef>Created</th>
          <td mat-cell *matCellDef="let user">{{ user.createdAt | date: 'dd.MM.yyyy HH:mm' }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell empty" colspan="3">No users yet</td>
        </tr>
      </table>
    }
  </div>
</div>
