<button
  type="button"
  class="theme-toggle"
  [class.dark]="theme() === 'dark'"
  [disabled]="themeSaving()"
  (click)="themeToggle.emit()"
  [attr.aria-label]="theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
  [matTooltip]="theme() === 'dark' ? 'Light theme' : 'Dark theme'"
  matTooltipPosition="below"
>
  <app-icon [name]="theme() === 'dark' ? 'light_mode' : 'dark_mode'" />
</button>

<div class="settings-shell">
  <button
    type="button"
    class="icon-button"
    [class.active]="settingsOpen()"
    (click)="settingsOpen.set(!settingsOpen())"
    aria-label="Open profile settings"
    [attr.aria-expanded]="settingsOpen()"
    matTooltip="Profile settings"
    matTooltipPosition="below"
  >
    <app-icon name="settings" />
  </button>

  @if (settingsOpen()) {
    <div class="settings-panel" role="dialog" aria-label="Profile settings">
      <div class="settings-panel__header">
        <div>
          <strong>Profile</strong>
          <span>Dashboard details</span>
        </div>
        <app-icon name="person" />
      </div>

      <form [formGroup]="profileForm()" (ngSubmit)="profileSave.emit()">
        <mat-form-field appearance="outline">
          <mat-label>First name</mat-label>
          <input matInput formControlName="firstName" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Last name</mat-label>
          <input matInput formControlName="lastName" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Location</mat-label>
          <input matInput formControlName="location" />
        </mat-form-field>

        @if (profileMessage()) {
          <p
            class="settings-message"
            [class.settings-message--error]="profileMessageIsError()"
          >
            {{ profileMessage() }}
          </p>
        }

        <button
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="profileSaving()"
        >
          {{ profileSaving() ? 'Saving...' : 'Save profile' }}
        </button>
      </form>
    </div>
  }
</div>

<button
  type="button"
  class="icon-button logout-button"
  aria-label="Log out"
  matTooltip="Log out"
  matTooltipPosition="below"
  (click)="logoutClick.emit()"
>
  <app-icon name="logout" />
</button>
