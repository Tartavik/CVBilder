@if (formControl(); as control) {
  <div class="field-shell" [class.has-counter]="showCharacterCounter()">
    <mat-form-field appearance="outline">
      <mat-label>{{ label() }}</mat-label>
      <input
        matInput
        [formControl]="control"
        [type]="type()"
        [placeholder]="placeholder()"
        [attr.min]="min()"
        [attr.max]="max()"
        [attr.maxlength]="nativeMaxLength()"
        [attr.inputmode]="type() === 'tel' ? 'tel' : null"
        [attr.autocomplete]="type() === 'tel' ? 'tel' : null"
        (input)="applyPhoneMask($event)"
      />
      <mat-error
        appFieldError
        [control]="control"
        [patternMessage]="patternMessage()"
      />
    </mat-form-field>
    @if (showCharacterCounter()) {
      <span class="character-counter" aria-hidden="true">
        {{ characterCount(control) }} of {{ characterLimit() }}
      </span>
    }
  </div>
}
