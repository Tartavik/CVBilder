@if (formControl(); as control) {
  <mat-form-field appearance="outline">
    <mat-label>{{ label() }}</mat-label>
    <textarea
      matInput
      [formControl]="control"
      [rows]="rows()"
      [placeholder]="placeholder()"
    ></textarea>
    <mat-error appFieldError [control]="control" />
  </mat-form-field>
}
